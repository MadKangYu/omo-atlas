<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OMO 지도 — 다이나믹 마인드맵</title>
<meta name="description" content="OMO / LazyCodex 23 스킬을 살아있는 노드 그래프로 — 떠다니는 마인드맵에서 전체 연결망을 탐색">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root{--ink:#1f2733;--mut:#5b6675;--line:#e3e7ee;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;color:var(--ink);overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);z-index:5;flex-wrap:wrap;}
  .brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px;}
  .brand .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7 55%,#ec4899);font-size:14px;}
  .brand small{display:block;font-weight:600;font-size:11px;color:var(--mut);}
  header .hint{font-size:11.5px;color:var(--mut);}
  header .sp{margin-left:auto;display:flex;gap:8px;align-items:center;}
  header a,header button{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer;}
  header a:hover,header button:hover{box-shadow:0 2px 8px rgba(16,24,40,.1);border-color:#6366f1;}
  header button.on{background:#6366f1;color:#fff;border-color:#6366f1;}
  .legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--mut);}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;}
  #stage{position:relative;flex:1;min-height:0;}
  #cy{position:absolute;inset:0;background-color:#fbfbfa;background-image:radial-gradient(#dfe3ea 1.1px, transparent 1.1px);background-size:22px 22px;}
  #panel{position:absolute;top:0;right:0;height:100%;width:380px;max-width:88vw;background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(16,24,40,.12);transform:translateX(102%);transition:.26s cubic-bezier(.4,0,.2,1);z-index:6;display:flex;flex-direction:column;}
  #panel.open{transform:none;}
  .ph{padding:18px 20px;border-bottom:1px solid var(--line);position:relative;}
  .ph .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#fff;padding:3px 10px;border-radius:999px;}
  .ph h2{margin:10px 0 5px;font-size:22px;letter-spacing:-.4px;}
  .ph .one{color:var(--mut);font-size:13px;font-weight:600;}
  .pc{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--mut);}
  .pb{padding:16px 20px;overflow-y:auto;}
  .pb h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:0 0 8px;}
  .pb .sec{margin-bottom:16px;}
  .pb p{margin:0;font-size:13.5px;line-height:1.6;color:#3a4150;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0;color:#334155;}
  .cmdbox{font-family:ui-monospace,monospace;font-size:13px;background:#0f172a;color:#cbd5e1;border-radius:9px;padding:11px 13px;}
  .rel{display:flex;flex-wrap:wrap;gap:7px;}
  .relp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .relp .d{width:8px;height:8px;border-radius:50%;}
  @media(max-width:640px){header .hint,header .legend{display:none;}}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="brand"><span class="logo">◎</span><span>OMO 지도<small>다이나믹 마인드맵</small></span></span>
    <span class="legend" id="legend"></span>
    <span class="hint">노드 클릭·드래그 · 휠 = 줌 · 전체가 살아 움직여요</span>
    <span class="sp"><button id="float" class="on">✨ 라이브</button><button id="fit">전체 보기</button><button id="loop">작업 루프</button><a href="/">← 카드 Atlas</a></span>

  <div id="stage"><div id="cy"></div><aside id="panel"><div id="panel-inner"></div></aside></div>
</div>

review-work","must":true,"one":"5방향 병렬 리뷰 (출구)","purpose":"구현 후 리뷰 오케스트레이터. 5개 병렬 서브에이전트(목표/품질/보안 Oracle + QA 실행 + 컨텍스트 마이닝). 모두 통과해야 통과.","triggers":["review work","QA my work","verify implementation","check my work"],"anti":["한 줄 typo·문서 수정엔 X"],"mech":["Phase 0 리뷰 컨텍스트 수집","5개 에이전트 병렬 발사","대기 & 수집","PASSED/FAILED/INCONCLUSIVE 평결"],"cmd":"/review-work","related":["git-master","visual-qa","debugging","start-work"]},{"id":"comment-checker","axis":"ops","name":"comment-checker","must":false,"one":"후크 피드백 해석/대응","purpose":"편집형 PostToolUse 후크가 내보낸 자동 comment-checker 피드백을 이해하고 대응.","triggers":["comment-checker 피드백 해석"],"anti":[],"mech":["피드백 스코프 해석","적절한 대응 결정"],"cmd":"—","related":["review-work","programming"]},{"id":"teammode","axis":"ops","name":"teammode","must":false,"warn":true,"one":"팀 오케스트레이션 (Ultimate/Codex-only)","purpose":"협력하는 Codex 스레드 팀을 명명·운영. 메인 세션이 항상 리더. 부품/소유영역/관점으로 구성(직무 아님).","triggers":["team mode","make a team","parallel Codex threads"],"anti":["완벽 격리/단일 작업엔 plain subagent"],"mech":["리더 — 오케스트레이트만, 구현 X","스크립트로 팀 상태 관리(.omo/teams)","겹치는 파일은 worktree 격리","ulw-plan 병렬 실행"],"cmd":"teammode","related":["start-work","ulw-plan"]},{"id":"ultimate-browsing","axis":"explore","name":"ultimate-browsing","must":false,"one":"WAF/로그인 차단 우회","purpose":"막힌/접근 어려운 웹을 위한 에스컬레이션 스킬. WAF·403·Cloudflare·JS-only·로그인게이트 우회. 3-tier 라우터.","triggers":["blocked site","cloudflare/WAF bypass","scrape","stealth browser","screenshot","youtube/xiaohongshu"],"anti":["단순검색=web-search · 평범한 fetch=webfetch"],"mech":["Phase 0 라우팅 먼저","Tier1 insane-search (curl_cffi TLS 임퍼소네이션)","Tier1.5 agent-reach (중국/소셜 플랫폼)","Tier2 Chrome stealth (CDP 클릭/폼/스샷)"],"cmd":"insane-search","related":["ultraresearch"]},{"id":"ultraresearch","axis":"explore","name":"ultraresearch","must":false,"one":"최대 포화 리서치 (explicit only)","purpose":"최대 포화 리서치 오케스트레이션. 코드베이스/웹/공식문서/OSS 병렬 스웜 + 재귀 EXPAND + 코드 실행 검증 + 인용 종합.","triggers":["ultraresearch","deep research","ultra-precise investigation (명시적일 때만)"],"anti":["일반 질문/디버깅엔 자가활성 X"],"mech":["협력 팀 스웜 운영","Phase0 분해 → Phase1 포화 → Phase2 수렴까지 확장","Phase3 코드 실행으로 검증","인용 종합 + MD/HTML/PDF/PPTX 리포트"],"cmd":"$ultraresearch","related":["ultimate-browsing","ulw-plan"]}]};
const AXC={}; DB.axes.forEach(a=>AXC[a.id]=a);
const byId={}; DB.skills.forEach(s=>byId[s.id]=s);
document.getElementById('legend').innerHTML = DB.axes.map(a=>'<span><i style="background:'+a.color+'"></i>'+a.name+'</span>').join('');

const els=[{data:{id:'omo',label:'OMO\nLazyCodex',kind:'root'}}];
DB.axes.forEach(a=>{ els.push({data:{id:'ax_'+a.id,label:a.name,kind:'axis',col:a.color}}); els.push({data:{source:'omo',target:'ax_'+a.id,kind:'spine'}}); });
DB.skills.forEach(s=>{ const c=AXC[s.axis].color; els.push({data:{id:s.id,label:s.name,kind:'skill',col:c,must:s.must?1:0}}); els.push({data:{source:'ax_'+s.axis,target:s.id,kind:'branch',col:c}}); });
const seen={};
DB.skills.forEach(s=>(s.related||[]).forEach(r=>{ if(!byId[r])return; const k=[s.id,r].sort().join('|'); if(seen[k])return; seen[k]=1; els.push({data:{source:s.id,target:r,kind:'rel'}}); }));

const cy=cytoscape({
  container:document.getElementById('cy'), elements:els, minZoom:.22,maxZoom:2.4, wheelSensitivity:.25,
  style:[
    {selector:'node',style:{'label':'data(label)','text-wrap':'wrap','text-valign':'center','text-halign':'center','font-family':'Gaegu, -apple-system, sans-serif','text-max-width':'120px','transition-property':'border-width, background-color, opacity','transition-duration':'140ms'}},
    {selector:'node[kind="root"]',style:{'shape':'round-rectangle','background-color':'#1f2733','color':'#fff','width':120,'height':64,'font-size':21,'font-weight':700,'border-width':0,'text-margin-y':-2,'border-color':'#a855f7'}},
    {selector:'node[kind="axis"]',style:{'shape':'round-rectangle','background-color':'data(col)','color':'#fff','font-size':16,'font-weight':700,'padding':'11px','width':'label','height':'26px','border-width':0}},
    {selector:'node[kind="skill"]',style:{'shape':'round-rectangle','background-color':'#ffffff','border-color':'data(col)','border-width':2,'color':'#1f2733','font-size':13,'padding':'8px','width':'label','height':'18px'}},
    {selector:'node[must=1]',style:{'border-width':4}},
    {selector:'edge',style:{'curve-style':'unbundled-bezier','control-point-distances':[18],'control-point-weights':[.5],'target-arrow-shape':'none'}},
    {selector:'edge[kind="spine"]',style:{'width':4,'line-color':'#aab4c4'}},
    {selector:'edge[kind="branch"]',style:{'width':2.4,'line-color':'data(col)','opacity':.6}},
    {selector:'edge[kind="rel"]',style:{'width':1.3,'line-color':'#cbd3df','line-style':'dashed'}},
    {selector:'.faded',style:{'opacity':.08}},
    {selector:'.pop',style:{'border-color':'#6366f1','border-width':5}}
  ],
  layout:{name:'cose',animate:true,animationDuration:900,idealEdgeLength:95,nodeRepulsion:13000,edgeElasticity:140,gravity:.55,padding:60,randomize:true,nestingFactor:1.1,componentSpacing:120}
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const panel=document.getElementById('panel'), pinner=document.getElementById('panel-inner');
function openSkill(id){
  const s=byId[id]; if(!s)return; const a=AXC[s.axis];
  pinner.innerHTML='<div class="ph"><button class="pc" onclick="closeP()">✕</button>'
    +'<span class="pill" style="background:'+a.color+'">'+a.icon+' '+a.name+'</span>'
    +'<h2>'+s.name+(s.must?' <span style="font-size:10px;color:#dc2626;border:1px solid #fecaca;background:#fef2f2;border-radius:5px;padding:2px 6px;vertical-align:3px">MUST</span>':'')+'</h2>'
    +'<div class="one">'+esc(s.one)+'</div></div><div class="pb">'
    +'<div class="sec"><h4>무엇인가</h4><p>'+esc(s.purpose)+'</p></div>'
    +'<div class="sec"><h4>이럴 때 · Trigger</h4><div class="tags">'+s.triggers.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div>'
    +'<div class="sec"><h4>핵심 메커니즘</h4><div class="tags">'+s.mech.map(m=>'<span class="tag">'+esc(m)+'</span>').join('')+'</div></div>'
    +'<div class="sec"><h4>호출</h4><div class="cmdbox">'+esc(s.cmd)+'</div></div>'
    +'<div class="sec"><h4>연결된 스킬 · '+s.related.length+'</h4><div class="rel">'+s.related.map(r=>{const rs=byId[r],ra=AXC[rs.axis];return '<span class="relp" onclick="jump(\''+r+'\')"><span class="d" style="background:'+ra.color+'"></span>'+rs.name+'</span>';}).join('')+'</div></div></div>';
  panel.classList.add('open');
}
window.closeP=function(){ panel.classList.remove('open'); cy.elements().removeClass('faded pop'); };
window.jump=function(id){ const n=cy.getElementById(id); highlight(n); cy.animate({center:{eles:n},zoom:1.15},{duration:450,easing:'ease-out'}); openSkill(id); };
function highlight(n){ const hood=n.closedNeighborhood(); cy.elements().addClass('faded'); hood.removeClass('faded'); cy.elements().removeClass('pop'); n.addClass('pop'); }
cy.on('tap','node',e=>{ const n=e.target; highlight(n); if(n.data('kind')==='skill') openSkill(n.id()); else closeP(); });
cy.on('tap', e=>{ if(e.target===cy) closeP(); });
cy.on('mouseover','node[kind="skill"]',e=>e.target.style('border-width', e.target.data('must')?7:4));
cy.on('mouseout','node[kind="skill"]',e=>{ if(!e.target.hasClass('pop')) e.target.style('border-width', e.target.data('must')?4:2); });
document.getElementById('fit').onclick=()=>{ closeP(); cy.animate({fit:{padding:60}},{duration:500,easing:'ease-out'}); };
document.getElementById('loop').onclick=()=>{ const path=['init-deep','ulw-plan','start-work','programming','frontend','review-work','git-master']; cy.elements().addClass('faded').removeClass('pop'); cy.getElementById('omo').removeClass('faded'); path.forEach(id=>cy.getElementById(id).removeClass('faded').addClass('pop')); };

/* ---- DYNAMIC: entrance + breathing float + center pulse ---- */
let floatOn=true, raf=0;
const fbtn=document.getElementById('float'); fbtn.onclick=()=>{ floatOn=!floatOn; fbtn.classList.toggle('on',floatOn); };
cy.one('layoutstop',()=>{
  cy.nodes().forEach(n=>n.scratch('_b',{x:n.position('x'),y:n.position('y')}));
  const t0=performance.now();
  function frame(now){
    if(floatOn){
      const t=(now-t0)/1000;
      cy.batch(()=>cy.nodes().forEach((n,i)=>{
        if(n.grabbed()){ n.scratch('_b',{x:n.position('x'),y:n.position('y')}); return; }
        const b=n.scratch('_b'); if(!b)return; const ph=i*0.7, amp=n.data('kind')==='root'?1.6:3.4;
        n.position({x:b.x+Math.sin(t*0.62+ph)*amp, y:b.y+Math.cos(t*0.5+ph)*amp});
      }));
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  // center pulse (border glow)
  let p=0; setInterval(()=>{ p+=0.16; const w=2.5+Math.abs(Math.sin(p))*5; cy.getElementById('omo').style('border-width',w); }, 55);
  cy.getElementById('omo').style('border-width',4);
});
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(()=>cy.style().update()); }
</script>
