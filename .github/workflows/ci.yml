name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    # Hosted ubuntu-latest is refused before start while the Actions spending limit is exhausted.
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: data.json <-> index.html consistency gate
        run: node verify.mjs
